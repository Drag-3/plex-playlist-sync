<!DOCTYPE html>
<html lang="eng">
<head>
    <title>PPS Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script>
        function confirmSubmit(username) {
            return confirm("Are you sure you want to log in as " + username + "?");
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>PPS Login</h1>
        <p>Select your username</p>
        <div class="card-group">
            {% for user in users %}
                <form method="post" action="/login" onsubmit="return confirmSubmit('{{ user.spotify_info.username }}')">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">{{ user.plex_username }}</h5>
                            <p class="card-text">{{ user.spotify_info.username }}</p>
                            <input type="hidden" name="username" value="{{ user.spotify_info.username }}">
                            <button type="submit" class="btn btn-primary">Select</button>
                        </div>
                    </div>
                </form>
            {% endfor %}
        </div>
    </div>
</body>
</html>
